name: Market level Telegram alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: Send a one-time Telegram test instead of scanning markets
        required: false
        type: boolean
        default: false
      scan_summary:
        description: Send one message listing all market prices and level status
        required: false
        type: boolean
        default: false

concurrency:
  group: market-level-alerts
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Scan markets and send Telegram alerts
        run: |
          if [ "${{ inputs.test_telegram }}" = "true" ]; then
            python main.py --test-telegram
          elif [ "${{ inputs.scan_summary }}" = "true" ]; then
            python main.py --scan-summary
          else
            python main.py
          fi
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save alert state
        run: |
          git config user.name "alert-bot"
          git config user.email "alert-bot@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "update alert state"
            git push
          fi
